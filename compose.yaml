# Local dev and test databases only. Credentials here are not secrets.
# Host ports 5442/5444 avoid clashing with other local Postgres containers on 5432/5434.
name: hla-trans
x-postgres: &postgres
  image: postgres:18.3-alpine3.23
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    POSTGRES_DB: main
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d main"]
    interval: 2s
    timeout: 3s
    retries: 15

services:
  postgres:
    <<: *postgres
    ports: ["5442:5432"]
    volumes: ["pgdata:/var/lib/postgresql"]

  postgres-test:
    <<: *postgres
    ports: ["5444:5432"]
    tmpfs: ["/var/lib/postgresql"]
    # The tmpfs is small (memory): WAL capped well under it, and no fsync for
    # a database that is thrown away. The default 1 GB WAL filled it.
    command:
      - postgres
      - -c
      - max_wal_size=128MB
      - -c
      - fsync=off
      - -c
      - full_page_writes=off

volumes:
  pgdata:
